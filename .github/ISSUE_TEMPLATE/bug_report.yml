name: Bug report
description: Report a reproducible problem with herdr-team
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, and what went wrong?
      placeholder: |
        Command: hts myproj --preset dev
        Expected: 4 panes with agents started
        Actual: error message ... (paste it)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git log -n 1 --oneline` in the repo, or release tag.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Windows (Git-Bash)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the full command output (use --dry-run first if it touches panes).
      render: shell
