name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preset + TUI suite
        run: bash tests/test_preset.sh
      - name: TUI i18n suite
        run: bash tests/test_tui_i18n.sh
      - name: PKM preset suite
        run: bash tests/test_pkm_preset.sh
      - name: Pane ready suite
        run: bash tests/test_pane_ready.sh
      - name: Permissions merge suite
        run: bash tests/test_permissions_merge.sh
      - name: Permissions seed suite
        run: bash tests/test_permissions_seed.sh
      - name: Testmap suite
        run: bash tests/test_testmap.sh
      - name: Template sync suite
        run: bash tests/test_template_sync.sh
      - name: Installer + release zip suite
        run: bash tests/test_install.sh
      - name: Windows launcher suite
        run: bash tests/test_windows_launcher.sh
      - name: herdr precheck suite
        run: bash tests/test_herdr_precheck.sh
      - name: Watcher suite
        run: bash tests/test_watcher.sh
      - name: Agent session suite
        run: bash tests/test_agent_session.sh
      - name: Version suite
        run: bash tests/test_version.sh
